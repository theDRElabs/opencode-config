name: Secret guard

# Added 2026-10-03 after a release signing keystore was committed to data-check
# and then pasted into this repo as calibration-fixture test data while both
# repos were public. Nothing here was caught by .gitignore alone.
#
# Three checks:
#   A. Forbidden credential paths, anywhere in history.
#   B. High-confidence provider tokens, in every tracked blob at HEAD.
#   C. Credential assignments with real-looking entropy, in every tracked blob
#      at HEAD. No allowlist -- this is the backstop that catches a real key
#      pasted into a fixture.
#
# The calibration fixtures under fixtures/fresh-review/calibration/ are
# deliberately exempt from A only (they track a keystore.properties on
# purpose, as negative-test material). They are NOT exempt from B or C.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A. Forbidden credential paths across all history
        run: |
          set -uo pipefail
          git log --all --pretty=format: --name-only --diff-filter=A \
            | sed '/^$/d' | sort -u > /tmp/ever-tracked.txt

          # Only A is allowlisted for calibration fixtures -- see header.
          grep -Eiv '^fixtures/fresh-review/calibration/' /tmp/ever-tracked.txt \
            | grep -Ei '(^|/)\.env($|\.)|(^|/)auth\.json$|(^|/)(keystore|secrets)\.properties$|(^|/)service\.json$|(^|/)(\.netrc|\.npmrc|\.pypirc)$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$|\.(pem|key|p12|pfx|jks|keystore|ppk|asc|gpg)$' \
            | grep -Eiv '(^|/)\.env\.(example|sample|template|dist)$' \
            > /tmp/bad-paths.txt || true

          if [ -s /tmp/bad-paths.txt ]; then
            echo "::error::Forbidden credential-shaped paths are tracked in history:"
            sed 's/^/  - /' /tmp/bad-paths.txt
            exit 1
          fi
          echo "A. ok -- $(wc -l < /tmp/ever-tracked.txt) paths ever tracked, none forbidden"

      - name: B and C. Secret content in tracked blobs
        run: |
          python3 - <<'PY'
          import re, subprocess, sys, base64

          files = subprocess.run(["git","ls-files","-z"],capture_output=True,check=True).stdout.split(b"\0")
          paths = [f.decode("utf-8","surrogateescape") for f in files if f]

          # B: unambiguous provider credential formats.
          TOKENS = [
              ("anthropic-key",  re.compile(rb"sk-ant-[A-Za-z0-9_-]{24,}")),
              ("openai-key",     re.compile(rb"sk-(?!ant-)[A-Za-z0-9]{32,}")),
              ("github-token",   re.compile(rb"gh[pousr]_[A-Za-z0-9]{30,}")),
              ("github-pat",     re.compile(rb"github_pat_[A-Za-z0-9_]{40,}")),
              ("google-key",     re.compile(rb"AIza[0-9A-Za-z_-]{30,}")),
              ("aws-key",        re.compile(rb"AKIA[0-9A-Z]{16}")),
              ("slack-token",    re.compile(rb"xox[baprs]-[A-Za-z0-9-]{20,}")),
              ("private-key",    re.compile(rb"-----BEGIN [A-Z ]*PRIVATE KEY-----")),
          ]

          # C: name=value credential assignment, value must look non-placeholder.
          ASSIGN = re.compile(
              rb"""(?i)\b(pass(?:word|wd)|secret|token|api[_-]?key|access[_-]?key|client[_-]?secret)"""
              rb"""\s*[=:]\s*["']?([A-Za-z0-9+/=_-]{16,})["']?"""
          )

          def placeholder(v: bytes) -> bool:
              """Reject obvious fakes so the fixture suite stays green."""
              s = v.decode("ascii", "replace")
              low = s.lower()
              if any(t in low for t in ("fake","dummy","example","placeholder","changeme",
                                        "your","xxxx","todo","redacted","not_a_real",
                                        "calibration","do_not_use","test")):
                  return True
              has_digit = any(c.isdigit() for c in s)
              has_upper = any(c.isupper() for c in s)
              has_lower = any(c.islower() for c in s)
              # Real credentials mix cases and digits; ALLCAPS sentinels do not.
              return not (has_digit and has_upper and has_lower)

          bad = []
          for p in paths:
              try:
                  blob = subprocess.run(["git","show",f"HEAD:{p}"],capture_output=True).stdout
              except Exception:
                  continue
              if not blob or b"\0" in blob[:4096]:
                  continue
              for name, rx in TOKENS:
                  for m in rx.finditer(blob):
                      bad.append((p, name, m.group(0)[:12].decode("ascii","replace") + "..."))
              for m in ASSIGN.finditer(blob):
                  if not placeholder(m.group(2)):
                      bad.append((p, "credential-assignment", m.group(2)[:12].decode("ascii","replace") + "..."))

          if bad:
              print("::error::Possible secrets in tracked files:")
              seen = set()
              for p, name, sample in bad:
                  k = (p, name, sample)
                  if k in seen: continue
                  seen.add(k)
                  print(f"  - {p}  [{name}]  {sample}")
              sys.exit(1)
          print(f"B+C. ok -- {len(paths)} tracked files scanned, no secrets")
          PY