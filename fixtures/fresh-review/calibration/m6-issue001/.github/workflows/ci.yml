name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug testDebugUnitTest lint --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: datacheck-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Enforce release APK size limit (4 MiB)
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk)"
          SIZE="$(stat -c%s "$APK")"
          echo "Release APK: $APK — $SIZE bytes (gate: must be < 4194304 bytes)"
          if [ "$SIZE" -ge 4194304 ]; then
            echo "::error::Release APK is $SIZE bytes, >= the 4194304-byte (4 MiB) limit"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: datacheck-release-apk
          path: app/build/outputs/apk/release/*.apk
